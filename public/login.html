<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container">

        <div class="row justify-content-center mt-5">

            <div class="col-md-4">

                <div class="card shadow">

                    <div class="card-body">

                        <h2 class="text-center mb-4">
                            Iniciar sesión
                        </h2>

                        <div class="mb-3">
                            <label class="form-label">
                                Correo
                            </label>

                            <input
                                type="email"
                                id="email"
                                class="form-control"
                                placeholder="javier@gmail.com"
                            >
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Contraseña
                            </label>

                            <input
                                type="password"
                                id="password"
                                class="form-control"
                                placeholder="1234"
                            >
                        </div>

                        <button
                            id="loginBtn"
                            class="btn btn-primary w-100"
                        >
                            Ingresar
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="login.js"></script>

</body>
</html>
